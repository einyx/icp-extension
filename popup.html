<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --ink: #1d1d1f;
      --muted: #86868b;
      --line: #e8e8ed;
      --hover: #f5f5f7;
      --accent: #0071e3;
    }
    * { box-sizing: border-box; }
    body {
      font: 13px -apple-system, system-ui, "Segoe UI", sans-serif;
      width: 300px; margin: 0; background: #fff; color: var(--ink);
    }
    header {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 14px 16px 10px;
    }
    header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
    header .count { font-size: 11px; color: var(--muted); }

    #status {
      padding: 0 16px 10px; color: var(--muted); font-size: 12px;
      border-bottom: 1px solid var(--line);
    }
    #status .err { color: #d70015; }

    #list { padding: 6px; max-height: 360px; overflow-y: auto; }
    #list:empty::after {
      content: "No saved logins for this site";
      display: block; padding: 22px 10px; text-align: center;
      color: var(--muted); font-size: 12px;
    }

    #save {
      border-top: 1px solid var(--line);
      padding: 10px 12px 12px;
    }
    #save button {
      width: 100%; padding: 7px 10px; font: inherit; font-size: 12px;
      color: var(--accent); background: var(--hover);
      border: 1px solid var(--line); border-radius: 7px; cursor: pointer;
    }
    #save button:hover:not(:disabled) { background: #eaf3ff; }
    #save button:disabled { color: var(--muted); cursor: default; }
    #save .msg { margin-top: 7px; font-size: 11px; color: var(--muted); }
    #save .msg.err { color: #d70015; }
    #save .msg.ok { color: #1a7f37; }
    #save .who {
      margin-top: 7px; padding: 7px 9px; border-radius: 7px;
      background: var(--hover); border: 1px solid var(--line); font-size: 12px;
    }
    #save .who .u { font-weight: 500; }
    #save .who .d { color: var(--muted); font-size: 11px; }
    #save .row { display: flex; gap: 6px; margin-top: 7px; }
    #save #genBtn { margin-top: 6px; }
    .suggestions { margin-top: 8px; }
    .suggestion {
      display: flex; align-items: center; gap: 6px; margin-top: 5px;
    }
    .suggestion span {
      flex: 1; font-family: monospace; font-size: 12px;
      word-break: break-all;
    }
    .suggestion button {
      flex: none; font-size: 11px; padding: 3px 8px; border-radius: 6px;
      border: 1px solid var(--line); background: #fff; color: var(--accent);
      cursor: pointer;
    }
    .suggestion button:hover { background: var(--hover); }
    #save .row button { flex: 1; }
    #save .row button.primary {
      color: #fff; background: var(--accent); border-color: var(--accent);
    }
    #save .row button.primary:hover:not(:disabled) { background: #0062bd; }

    .cred {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 10px; border-radius: 8px; cursor: pointer;
    }
    .cred:hover { background: var(--hover); }
    .cred .avatar {
      width: 28px; height: 28px; flex: none; border-radius: 6px;
      display: grid; place-items: center; font-weight: 600; font-size: 13px;
      text-transform: uppercase; color: var(--muted);
      background: var(--hover); border: 1px solid var(--line);
    }
    .cred:hover .avatar { background: #fff; }
    .cred .meta { min-width: 0; flex: 1; }
    .cred .u { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cred .d { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cred .code {
      flex: none; font-size: 12px; color: var(--accent); letter-spacing: .06em;
      font-variant-numeric: tabular-nums; padding: 2px 6px; border-radius: 5px;
    }
    .cred .code:hover { background: #eaf3ff; }
    .cred .fill { flex: none; font-size: 11px; color: var(--accent); opacity: 0; }
    .cred:hover .fill { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <h1>iCloud Passwords</h1>
    <span class="count" id="subcount"></span>
  </header>
  <div id="status">Connecting...</div>
  <div id="list"></div>
  <div id="save">
    <button id="saveBtn">Save this login to iCloud Keychain</button>
    <button id="genBtn">Suggest a strong password</button>
    <div id="saveMsg" class="msg"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
